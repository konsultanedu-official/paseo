services:
  paseo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Headless daemon. Relay is the primary Desktop transport; the daemon is
      # still published to VPS loopback only for health checks and SSH fallback.
      PASEO_LISTEN: "0.0.0.0:6767"
      PASEO_WEB_UI_ENABLED: "false"

      # Defense in depth for direct/loopback access. Relay pairing still uses
      # Paseo's own end-to-end encrypted relay transport.
      PASEO_PASSWORD: "${PASEO_PASSWORD}"

      # Headless VPS profile: keep local speech off so the daemon does not
      # download/run STT/TTS models on the server. Desktop browser tooling is
      # unaffected; voice/dictation can be enabled later if explicitly needed.
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"

      # Optional workspace service proxy for dev previews. Keep it loopback-only
      # on the VPS and publish it through a separate trusted reverse proxy/tunnel.
      # Do not set PASEO_SERVICE_PROXY_PUBLIC_BASE_URL to an empty string:
      # Paseo validates any present value as a URL. Add it only when preview
      # publishing is actually configured.
      PASEO_SERVICE_PROXY_LISTEN: "${PASEO_SERVICE_PROXY_LISTEN:-0.0.0.0:8080}"
      PASEO_HOSTNAMES: "${PASEO_HOSTNAMES:-localhost,127.0.0.1}"
      PASEO_TRUSTED_PROXIES: "${PASEO_TRUSTED_PROXIES:-loopback,172.16.0.0/12}"

      # Model gateway / OpenCode runtime.
      NINEROUTER_BASE_URL: "${NINEROUTER_BASE_URL}"
      NINEROUTER_API_KEY: "${NINEROUTER_API_KEY}"
      OPENCODE_CONFIG: "/etc/opencode/opencode.vps.json"
      # Enable OpenCode hosted web search for non-OpenCode providers.
      OPENCODE_ENABLE_EXA: "1"

      # Optional Vite wildcard preview allowlist, e.g. .dev.example.com
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}"

    ports:
      # Paseo control plane: never public. Relay needs outbound 443 only.
      # Loopback remains available for local health/debug and SSH fallback.
      - "127.0.0.1:6767:6767"

      # Preview/service proxy. A host reverse proxy or tunnel may publish this.
      - "127.0.0.1:18080:8080"

      # Read-only MCP sidecar shares this service's network namespace and listens
      # on port 3000 there. Keep it loopback-only on the VPS.
      - "127.0.0.1:17677:3000"

    volumes:
      - paseo_home:/home/paseo
      - paseo_workspace:/workspace

    security_opt:
      - no-new-privileges:true


  paseo-mcp-ro:
    build:
      context: ./paseo-mcp-ro
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      paseo:
        condition: service_healthy
    # Share Paseo's network namespace so the SDK can connect through localhost.
    # This preserves Paseo's Host-header/DNS-rebinding protection without adding
    # an internal Docker hostname to the daemon allowlist.
    network_mode: "service:paseo"
    environment:
      PASEO_DAEMON_URL: "ws://127.0.0.1:6767/ws"
      PASEO_PASSWORD: "${PASEO_PASSWORD}"
      PASEO_MCP_HOST: "0.0.0.0"
      PASEO_MCP_PORT: "3000"
      PASEO_WORKSPACE_ROOT: "/workspace"
      PASEO_MCP_MAX_TEXT: "60000"
    volumes:
      - paseo_workspace:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


volumes:
  paseo_home:
  paseo_workspace:
