services:
  paseo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PASEO_PASSWORD: "${PASEO_PASSWORD}"
      PASEO_HOSTNAMES: "${PASEO_HOSTNAMES}"
      NINEROUTER_BASE_URL: "${NINEROUTER_BASE_URL}"
      NINEROUTER_API_KEY: "${NINEROUTER_API_KEY}"
      OPENCODE_CONFIG: "/etc/opencode/opencode.json"
    expose:
      - "6767"
    volumes:
      - paseo_home:/home/paseo
      - paseo_workspace:/workspace

volumes:
  paseo_home:
  paseo_workspace:
